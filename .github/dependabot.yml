version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: direct
    # Workspace packages are released in lockstep by scripts/release.mjs
    ignore:
      - dependency-name: binden
      - dependency-name: "@binden/*"
    assignees:
      - vansergen
    versioning-strategy: increase
    labels:
      - dependabot
      - dependencies
    commit-message:
      prefix: dependencies
      prefix-development: devDependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    assignees:
      - vansergen
    labels:
      - dependabot
      - ci
    commit-message:
      prefix: ci
