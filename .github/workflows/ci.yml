name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Recovers a release that failed after its tag was pushed (see "Releases" in the README)
  workflow_dispatch:
    inputs:
      version:
        description: The version of the release to recover (its tag v<version> exists)
        required: true
        type: string

permissions:
  contents: read

# Outdated pull request runs are cancelled. Runs on `main` are never cancelled,
# so a release cannot be interrupted half-way (tag pushed, packages partially published).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies and build the workspaces
        run: npm ci

      # The registry signatures (and provenance attestations) of the installed packages
      - name: Signatures of the dependencies
        run: npm audit signatures

      # The dependencies of the published packages. The advisories of the development
      # dependencies are reviewed in the README ("Dependencies").
      - name: Audit of the production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lockstep versions
        run: npm run release:check

      - name: Prettier
        run: npm run prettier

      - name: commitlint
        run: npx commitlint --verbose --from "$FROM" --to "$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: ESLint
        run: npm run eslint

      - name: Tooling tests (release scripts, test runner)
        run: npm run test:tooling

      # The examples and the process-level scenarios (shutdown, disconnects, shared
      # middlewares), each in a process of its own, against the built workspaces
      - name: Acceptance (examples and process-level scenarios)
        run: npm run acceptance

      - name: Docs
        run: npm run docs:build

      - name: Upload docs
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  # The archives of the next release, made without any right to publish: the next version
  # (semantic-release in a local clone, see scripts/release-rehearsal.mjs), `verify`,
  # `version` and `pack` of every workspace on the runtime of the release, the checks of the
  # archives, then the archives and their manifest as an artifact of this run. The `release`
  # job publishes exactly these archives (see "Releases" in the README); in pull requests,
  # this job is the rehearsal of the release.
  package:
    if: github.event_name != 'workflow_dispatch'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-digest: ${{ steps.digest.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The runtime of the `release` and `recover` jobs, so that the archives that they
      # publish are the ones that npm would pack there
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0

      - name: Runtime (Node.js 24.16.0 and its npm 11.13.0)
        run: |
          node --version
          npm --version
          test "$(node --version)" = v24.16.0
          test "$(npm --version)" = 11.13.0

      - name: Install dependencies and build the workspaces
        run: npm ci

      - name: Signatures of the dependencies
        run: npm audit signatures

      # The next version and its release notes (or the current version when no release is
      # due), then the archives of the release and their manifest (scripts/release.mjs
      # `verify`, `version` and `pack`), checked in another clone as the release job checks
      # them (`version` and `publish --dry-run`): nothing is tagged or published
      - name: Release rehearsal
        run: npm run release:rehearsal -- "$RUNNER_TEMP/release"

      - name: Packed files (scripts/pack-files.json)
        run: node scripts/pack-check.mjs --tarballs "$RUNNER_TEMP/release"

      - name: Consumer check (the archives of the release, TypeScript and ESM)
        run: node scripts/consumer-check.mjs --tarballs "$RUNNER_TEMP/release"

      # Reported as an output of this job, which the publishing job compares with the
      # manifest of the artifact that it downloads
      - name: Digest of the manifest
        id: digest
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/release/release-manifest.json" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload the archives
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: |
            ${{ runner.temp }}/release/release-manifest.json
            ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error

  test:
    if: github.event_name != 'workflow_dispatch'

    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version (the `engines` of the packages), and the latest of each line
        node-version: [24.14.1, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      - name: Install dependencies and build the workspaces
        run: npm ci

      - name: Tests (with coverage)
        run: npm run coverage

      - name: Coveralls
        if: matrix.node-version == 24
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  # The tests and the tooling (paths, line endings, child processes) on Windows
  windows:
    if: github.event_name != 'workflow_dispatch'

    runs-on: windows-latest

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies and build the workspaces
        run: npm ci

      - name: Tests
        run: npm test

      - name: Tooling tests (release scripts, test runner)
        run: npm run test:tooling

  # The tests on macOS (its sockets, file system and timers)
  macos:
    if: github.event_name != 'workflow_dispatch'

    runs-on: macos-latest

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies and build the workspaces
        run: npm ci

      - name: Tests
        run: npm test

  # The dependencies that a pull request adds or updates, against the advisory database
  dependency-review:
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: [lint, test, windows, macos, package]

    runs-on: ubuntu-latest

    timeout-minutes: 30

    # Its name is the one of the npm trusted publisher
    environment: release

    # One publication at a time (with the `recover` job), never cancelled half-way
    concurrency:
      group: publish
      cancel-in-progress: false

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The runtime of the `package` job, which made the archives: its npm publishes them
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      - name: Runtime (Node.js 24.16.0 and its npm 11.13.0)
        run: |
          node --version
          npm --version
          test "$(node --version)" = v24.16.0
          test "$(npm --version)" = 11.13.0

      # semantic-release and its plugins only: nothing is built or packed in this job, and
      # the scripts of the dependencies do not run with its rights
      - name: Install the release tooling
        run: npm ci --ignore-scripts

      - name: Signatures of the dependencies
        run: npm audit signatures

      # The artifact that the `package` job of this run uploaded (by its id, never the
      # artifact of another run), whose digest the action checks
      - name: Download the archives of the package job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/release

      - name: Check the manifest of the archives
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/release/release-manifest.json" | cut -d ' ' -f 1)
          if [ "$digest" != "$MANIFEST_DIGEST" ]; then
            echo "::error::The manifest of the archives ($digest) is not the one that the packing job reported (${MANIFEST_DIGEST:-none})"
            exit 1
          fi
        env:
          MANIFEST_DIGEST: ${{ needs.package.outputs.manifest-digest }}

      # Tags the release, publishes the archives of the `package` job and creates the GitHub
      # Release, whose notes are the changelog. Before the tag, `prepareCmd` sets the version of
      # the release in the workspaces (scripts/release.mjs `version`, no build and no pack)
      # and checks the archives with `publish --dry-run`: their version must be the next one,
      # their commit HEAD, their integrity the one of the manifest, their files the expected
      # ones, and none may be published yet. Any difference fails the release before anything
      # is tagged. `publishCmd` then publishes these archives once the registry is checked for
      # all of them. Nothing is committed to `main`, so its branch protection applies as
      # usual. npm uses trusted publishing (OIDC) when it is configured for a package and
      # falls back to NODE_AUTH_TOKEN otherwise.
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          RELEASE_DIR: ${{ runner.temp }}/release

  # The archives of a release to recover (see "Recovering a release" in the README), made
  # without any right to publish: once the version, its tag and the commit of the tag are
  # checked, the commit of the tag is packed on the runtime of the release, and the archives
  # are checked and uploaded as an artifact of this run for the `recover` job
  recover-package:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    env:
      VERSION: ${{ inputs.version }}

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-digest: ${{ steps.digest.outputs.sha256 }}

    steps:
      # Nothing of the repository runs (not even `npm ci`, which runs its `prepare` script)
      # before the version, its tag and the commit of the tag are checked. SemVer 2.0.0
      # without build metadata, as `scripts/release.mjs` (and its tests) validate it.
      - name: Check the version
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ! LC_ALL=C bash -c '[[ $1 =~ $2 ]]' bash "$VERSION" "$semver"; then
            echo "::error::The version is not a SemVer version (without build metadata)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag that is not on `main` (pushed by hand, or on another branch) is never published
      - name: Check the tag and its commit
        run: |
          if ! commit=$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}"); then
            echo "::error::The tag v$VERSION does not exist"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::The commit of v$VERSION ($commit) is not on main"
            exit 1
          fi
          git checkout --quiet --detach "$commit"

      # The runtime of the `release` job, so that the archives are the ones that it packed
      # (bit for bit) from the same commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0

      - name: Runtime (Node.js 24.16.0 and its npm 11.13.0)
        run: |
          node --version
          npm --version
          test "$(node --version)" = v24.16.0
          test "$(npm --version)" = 11.13.0

      - name: Install dependencies and build the workspaces
        run: npm ci

      - name: Signatures of the dependencies
        run: npm audit signatures

      - name: Pack the archives of the release
        run: |
          node scripts/release.mjs version "$VERSION"
          node scripts/release.mjs pack "$RUNNER_TEMP/release"

      - name: Packed files (scripts/pack-files.json)
        run: node scripts/pack-check.mjs --tarballs "$RUNNER_TEMP/release"

      - name: Consumer check (the archives of the release, TypeScript and ESM)
        run: node scripts/consumer-check.mjs --tarballs "$RUNNER_TEMP/release"

      - name: Digest of the manifest
        id: digest
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/release/release-manifest.json" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload the archives
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: |
            ${{ runner.temp }}/release/release-manifest.json
            ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error

  # Publishes the packages of a release that are not published yet, from the archives of the
  # `recover-package` job of this run (`scripts/release.mjs` checks that the published ones are
  # the same archives), and creates its GitHub Release when it is missing. Run from the Actions
  # tab (in this workflow, which npm trusts for publishing).
  recover:
    if: github.event_name == 'workflow_dispatch'

    needs: recover-package

    runs-on: ubuntu-latest

    timeout-minutes: 30

    environment: release

    concurrency:
      group: publish
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write

    env:
      VERSION: ${{ inputs.version }}

    steps:
      # The same checks as the `recover-package` job, before anything of the repository runs
      - name: Check the version
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ! LC_ALL=C bash -c '[[ $1 =~ $2 ]]' bash "$VERSION" "$semver"; then
            echo "::error::The version is not a SemVer version (without build metadata)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag and its commit
        run: |
          if ! commit=$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}"); then
            echo "::error::The tag v$VERSION does not exist"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::The commit of v$VERSION ($commit) is not on main"
            exit 1
          fi
          git checkout --quiet --detach "$commit"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      - name: Runtime (Node.js 24.16.0 and its npm 11.13.0)
        run: |
          node --version
          npm --version
          test "$(node --version)" = v24.16.0
          test "$(npm --version)" = 11.13.0

      - name: Download the archives of the recover-package job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.recover-package.outputs.artifact-id }}
          path: ${{ runner.temp }}/release

      - name: Check the manifest of the archives
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/release/release-manifest.json" | cut -d ' ' -f 1)
          if [ "$digest" != "$MANIFEST_DIGEST" ]; then
            echo "::error::The manifest of the archives ($digest) is not the one that the packing job reported (${MANIFEST_DIGEST:-none})"
            exit 1
          fi
        env:
          MANIFEST_DIGEST: ${{ needs.recover-package.outputs.manifest-digest }}

      # Sets the version in the workspaces (no build, no pack: nothing of the dependencies is
      # installed in this job), checks the archives against the commit of the tag and the
      # registry for all of them, then publishes the missing ones with provenance
      - name: Publish the packages that are not published yet
        run: |
          node scripts/release.mjs version "$VERSION"
          node scripts/release.mjs publish "$RUNNER_TEMP/release" --skip-existing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Only a 404 means that the release is missing: any other answer (or none) fails. Its
      # notes are generated by GitHub (from the merged pull requests) rather than
      # semantic-release.
      - name: Create the GitHub Release when it is missing
        run: |
          status=0
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
            > "$RUNNER_TEMP/github-release.http" || status=$?
          line=''
          IFS= read -r line < "$RUNNER_TEMP/github-release.http" || true
          missing='^HTTP/[0-9.]+ 404( |$)'
          if [ "$status" -eq 0 ]; then
            echo "The GitHub Release v$VERSION exists"
          elif [[ $line =~ $missing ]]; then
            previous=$(git describe --tags --abbrev=0 --match 'v*' "v$VERSION^")
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" \
              --generate-notes --notes-start-tag "$previous"
          else
            echo "::error::Cannot tell whether the GitHub Release v$VERSION exists: ${line:-no response}"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # The documentation artifact is uploaded by the `lint` job. The docs of `main` are
    # deployed even when no release is due (or the release fails).
    needs: [lint, test, windows, macos]

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
