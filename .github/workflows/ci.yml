name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Outdated pull request runs are cancelled. Runs on `main` are never cancelled,
# so a release cannot be interrupted half-way (tag pushed, packages partially published).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies and build the workspaces
        run: npm ci

      - name: Lockstep versions
        run: npm run release:check

      - name: Prettier
        run: npm run prettier

      - name: commitlint
        run: npx commitlint --verbose --from "$FROM" --to "$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: ESLint
        run: npm run eslint

      - name: Tooling tests (release script, test runner)
        run: npm run test:tooling

      - name: Pack (test)
        run: npm run pack:check

      - name: Consumer check (packed packages, TypeScript and ESM)
        run: npm run consumer:check

      - name: Docs
        run: npm run docs:build

      - name: Upload docs
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  test:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      - name: Install dependencies and build the workspaces
        run: npm ci

      - name: Tests (with coverage)
        run: npm run coverage

      - name: Coveralls
        if: matrix.node-version == 24
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  # The tests and the tooling (paths, line endings, child processes) on Windows
  windows:
    runs-on: windows-latest

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies and build the workspaces
        run: npm ci

      - name: Tests
        run: npm test

      - name: Tooling tests (release script, test runner)
        run: npm run test:tooling

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: [lint, test, windows]

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org

      - name: Install dependencies and build the workspaces
        run: npm ci

      # Tags the release, publishes every workspace with the same version (see
      # scripts/release.mjs) and creates the GitHub Release, whose notes are the changelog.
      # Nothing is committed to `main`, so its branch protection applies as usual.
      # npm uses trusted publishing (OIDC) when it is configured for a package and
      # falls back to NODE_AUTH_TOKEN otherwise.
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # The documentation artifact is uploaded by the `lint` job.
    needs: [release]

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
