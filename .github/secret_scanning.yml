# Secret scanning (https://docs.github.com/en/code-security/secret-scanning):
# the private key of the TLS tests of binden is a throwaway key, generated for
# them and published on purpose. Only that file is excluded; no tarball contains
# it (scripts/pack-check.mjs refuses keys and tests).
paths-ignore:
  - "packages/binden/test/cert/key.pem"
